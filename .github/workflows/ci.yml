name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Arch matches Omarchy and ships ImageMagick 7 (`magick`), which the render tests use.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed rust imagemagick fontconfig ttf-dejavu python jq git
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Keybindings test
        run: cargo build --locked && python3 tests/keybindings.py
      - name: Installer test
        run: bash tests/install.sh
      - name: Manifest and version consistency
        run: |
          jq -e '.id == "omashot" and (.entryPoints.overlay | length > 0)' plugin/manifest.json
          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          manifest_version=$(jq -r .version plugin/manifest.json)
          test "$cargo_version" = "$manifest_version" || { echo "Cargo.toml ($cargo_version) and manifest.json ($manifest_version) versions differ"; exit 1; }
      - name: Python syntax
        run: python3 -m py_compile scripts/*.py tests/*.py

name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead. Screenshots help, but redact anything sensitive.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `omashot-ui region`
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OmaShot version
      description: Output of `omashot help | jq -r .version`
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Omarchy version, monitor setup and scaling, and the output of `./scripts/doctor.sh`.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output from the shell or `qs -p plugin`.
      render: text
